specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Competition
    network: worldchain-mainnet
    source:
      address: "0x8471C05150f72eA45fb71Cbae6961EAC44F74584"
      abi: Competition
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - MatchClosed
        - MatchCreated
        - PlayerJoined
      abis:
        - name: Competition
          file: ./abis/Competition.json
      eventHandlers:
        - event: MatchClosed(indexed uint256,address,uint256,uint256)
          handler: handleMatchClosed
        - event: MatchCreated(indexed uint256,string,uint256,uint256)
          handler: handleMatchCreated
        - event: PlayerJoined(indexed uint256,indexed address)
          handler: handlePlayerJoined
      file: ./src/competition.ts
