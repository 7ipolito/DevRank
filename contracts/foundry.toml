[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "@forge-std/=lib/forge-std/src/", "forge-std/=lib/forge-std/src/"]

# Solidity compiler settings
solc = "0.8.22"

fs_permissions =[
    {access = "read", path = "./broadcast"},
    {access = "read", path = "./reports"}
]
# Testing settings
[fuzz]
runs = 256