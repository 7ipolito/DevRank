[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@forge-std/=lib/forge-std/src/"
]

# Solidity compiler settings
solc_version = "0.8.22"
auto_detect_solc = false

# Optimizer settings
optimizer = true
optimizer_runs = 200

# Gas reporting
gas_reports = ["*"]

# Network configurations
[rpc_endpoints]
worldchain = "https://worldchain-mainnet.g.alchemy.com/public"
worldchain_sepolia = "https://worldchain-sepolia.g.alchemy.com/public"
localhost = "http://127.0.0.1:8545"

[etherscan]
worldchain = { key = "${WORLDSCAN_API_KEY}", url = "https://worldchain.blockscout.com/api" }
worldchain_sepolia = { key = "${WORLDSCAN_API_KEY}", url = "https://worldchain-sepolia.blockscout.com/api" }

# Testing settings
[fuzz]
runs = 1000
max_test_rejects = 65536
seed = '0x1'
dictionary_weight = 40
include_storage = true
include_push_bytes = true

[invariant]
runs = 256
depth = 15
fail_on_revert = false
call_override = false
dictionary_weight = 80
include_storage = true
include_push_bytes = true

# Performance optimizations
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

# CI Profile for faster testing
[profile.ci]
fuzz = { runs = 100 }
invariant = { runs = 10 }

# Local development profile
[profile.local]
optimizer = false
via_ir = false